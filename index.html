function opts(correct){const pool=Array.from({length:21},(_,i)=>i).filter(n=>n!==correct).sort((a,b)=>Math.abs(a-correct)-Math.abs(b-correct));const wrong=[];while(wrong.length<2){let candidate=pool[Math.floor(Math.random()*Math.min(pool.length,9))];if(!wrong.includes(candidate))wrong.push(candidate);}const arr=[correct,...wrong];for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}

function btn(text,fn,cls=''){return `<button class="btn ${cls}" data-act="${fn}">${text}</button>`}function render(){let html='';if(state==='play'){const q=current();html=`<div class="top"><span class="pill">🧟 LEVEL ${level+1} · ${index+1}/4</span><span class="pill">⭐ ${score} MARKAH</span><button class="hudBtn" data-act="audio">${muted?'🔇':'🔊'}</button><button class="hudBtn" data-act="pause">⏸</button></div><div class="progress"><div style="width:${index*25}%"></div></div><div class="question">${q.a} ${q.op==='-'?'−':'+'} ${q.b} = ?</div><div class="bottom"><div class="hint">🎯 Pilih zombie atau tekan 1, 2, 3 · ← → pilih · Enter tembak</div><button class="shoot" data-act="shoot">💥 TEMBAK!</button></div>${message?`<div class="msg" role="status">${message}</div>`:''}`;}else{let title='',body='',actions='';if(state==='menu'){title='🧟 ZOMBIE SHOOT MATH';body='<p>🎯 Tembak zombie comel yang membawa <b>jawapan Matematik yang betul!</b><br>➕ Tambah &nbsp; ➖ Tolak &nbsp; ⭐ 10 level · 40 soalan</p>';actions=btn('▶ MULA BERMAIN','start')+btn('🗺️ PILIH LEVEL','levels','alt')+btn('📖 CARA MAIN','help','alt')+btn(muted?'🔇 AUDIO MATI':'🔊 AUDIO HIDUP','audio','pink');}if(state==='help'){title='📖 CARA MAIN';body='<p>1. Baca soalan Matematik di atas.<br>2. Lihat nombor pada baju tiga zombie.<br>3. Tekan zombie dengan jawapan betul, atau pilih menggunakan kekunci <b>1, 2, 3</b>.<br>4. Tekan <b>TEMBAK</b> atau <b>Enter</b>.<br>5. Jawapan betul mendapat <b>10 markah</b>. Jika salah, cuba lagi! Tiada had masa.</p>';actions=btn('🏠 KEMBALI','menu');}if(state==='levels'){title='🗺️ PILIH LEVEL';body='<div class="levelGrid">'+names.map((n,i)=>`<button class="btn ${i%2?'alt':''}" data-level="${i}" ${i>=saved.unlocked?'disabled':''}>${i>=saved.unlocked?'🔒':'⭐'} ${i+1}<br><small>${saved.best[i]}/40</small></button>`).join('')+'</div><p class="note">Selesaikan level sebelumnya untuk membuka level seterusnya.</p>';actions=btn('🏠 KEMBALI','menu')+btn('🗑️ RESET','reset','pink');}if(state==='pause'){t function action(a){if(a==='audio'){muted=!muted;render();return}if(a==='start'){start(Math.min(saved.unlocked-1,9));return}if(a==='advance'){start(Math.min(level+1,9));return}if(a==='restart'){start(level);return}if(a==='shoot'){shoot();return}if(a==='reset'){if(confirm('Padam semua markah dan level yang telah dibuka?')){saved={unlocked:1,best:Array(10).fill(0)};save();render();}return}if(a==='pause'){state='pause';render();return}if(a==='resume'){state='play';render();return}state=a;render();}
